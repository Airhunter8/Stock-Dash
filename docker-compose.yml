version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: stockdash-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: stockdash
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stockdash-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: .
      dockerfile: infrastructure/Dockerfile.frontend
    container_name: stockdash-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://postgres:password@postgres:5432/stockdash
      - AUTH_SECRET=${AUTH_SECRET}
      - REDIS_URL=redis://redis:6379
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY}
      - NEXT_PUBLIC_WS_URL=http://localhost:3001
      - NEXTAUTH_URL=http://localhost:3000
      - NODE_ENV=production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && node server.js"

  websocket:
    build:
      context: ./backend
      dockerfile: ../infrastructure/Dockerfile.backend
    container_name: stockdash-websocket
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_APP_URL=http://localhost:3000
      - WS_PORT=3001
      - NODE_ENV=production
    depends_on:
      - frontend

volumes:
  postgres_data:
  redis_data:
